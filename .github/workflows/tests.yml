name: Automatic version, wheel tests and GitHub Release

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump (auto publishes current version first, then patch)
        type: choice
        default: auto
        options: [auto, patch, minor, major]

permissions:
  contents: read

concurrency:
  group: openfe-flex-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  automation-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - run: python -m unittest discover -s .github/tests -v

  prepare:
    needs: automation-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      ref: ${{ steps.version.outputs.ref }}
      release: ${{ steps.version.outputs.release }}
      skip: ${{ steps.version.outputs.skip }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.ref == 'refs/heads/master' && github.event_name != 'pull_request' && 'refs/heads/master' || github.sha }}
          fetch-depth: 0
          persist-credentials: ${{ github.ref == 'refs/heads/master' && github.event_name != 'pull_request' }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - name: Configure release bot identity
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
      - name: Prepare version, source commit and tag
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION_BUMP: ${{ inputs.bump || 'auto' }}
        run: python .github/scripts/release.py prepare --bump="$VERSION_BUMP"

  build:
    needs: prepare
    if: needs.prepare.outputs.skip != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.prepare.outputs.ref }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - run: python -m pip install 'build>=1.2,<2'
      - run: python -m build
      - name: Verify package contents, version and checksums
        run: python .github/scripts/distribution.py prepare
      - name: Verify planned version matches package
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: python .github/scripts/distribution.py verify --tag="$RELEASE_TAG"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: openfe-flex-distributions
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  test-wheel:
    needs: [prepare, build]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04, windows-latest, macos-15, macos-15-intel]
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.prepare.outputs.ref }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ matrix.python }}
      - name: Create a clean wheel-test environment
        run: python -c "import os,pathlib,venv; venv.create('.ci-venv', with_pip=True); p=pathlib.Path('.ci-venv').resolve()/('Scripts' if os.name=='nt' else 'bin'); open(os.environ['GITHUB_PATH'],'a').write(str(p)+'\n')"
      - name: Install OpenMP runtime for LightGBM on macOS
        if: runner.os == 'macOS'
        run: brew list libomp >/dev/null 2>&1 || brew install libomp
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: openfe-flex-distributions
          path: dist
      - name: Install and test core wheel without model extras
        run: |
          python .github/scripts/distribution.py install
          python -c "from pathlib import Path; import openfe_flex; assert not Path(openfe_flex.__file__).is_relative_to(Path('src').resolve()), openfe_flex.__file__"
          python -m unittest discover -s tests -v
      - name: Test LightGBM-only installation
        run: |
          python .github/scripts/distribution.py install --extras lightgbm
          python -c "import importlib.util; assert importlib.util.find_spec('catboost') is None"
          python -m unittest discover -s tests -v
          python examples/classification.py --backend lightgbm --classes 3 --candidates 6 --keep 3
      - name: Test both model extras
        run: |
          python .github/scripts/distribution.py install --extras all
          python -m unittest discover -s tests -v
          python examples/classification.py --backend catboost --classes 3 --candidates 6 --keep 3
          python -m pip check

  release:
    needs: [prepare, build, test-wheel]
    if: needs.prepare.outputs.release == 'true' && github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.prepare.outputs.ref }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: openfe-flex-distributions
          path: dist
      - name: Verify and publish tested distributions
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          python .github/scripts/distribution.py verify --tag="$RELEASE_TAG"
          python .github/scripts/release.py publish
